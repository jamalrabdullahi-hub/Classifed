# Local development dependencies only. The application itself runs on the host
# via `pnpm dev`; production deployment is native Node + Postgres on a VPS
# (see deploy/).
services:
  postgres:
    image: postgres:17-alpine
    container_name: flt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flt
      POSTGRES_PASSWORD: flt_dev_password
      POSTGRES_DB: flt_exchange
    ports:
      # 5433 on the host, so a local Postgres on 5432 is not shadowed.
      - '5433:5432'
    volumes:
      - flt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flt -d flt_exchange']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flt-postgres-data:
