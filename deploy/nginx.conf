# FLT Exchange reverse proxy.
#
# Two hostnames, two upstreams, deliberately separate. The admin panel is not a
# path on the consumer host: keeping it on its own name means it can be
# restricted at the network layer without touching the application.

upstream flt_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream flt_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Rate limiting at the edge, in front of the application's own token buckets.
# This one exists to absorb volumetric abuse before it reaches Node at all.
limit_req_zone $binary_remote_addr zone=flt_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=flt_auth:10m rate=2r/s;

# ── Consumer application ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.fltexchange.example;

    ssl_certificate     /etc/letsencrypt/live/app.fltexchange.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.fltexchange.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 1m;

    location / {
        limit_req zone=flt_general burst=60 nodelay;
        proxy_pass http://flt_web;
        include /etc/nginx/proxy_params_flt;
    }

    # Authentication endpoints get a tighter edge limit than the rest.
    location ~ ^/api/auth/(login|register|password-reset) {
        limit_req zone=flt_auth burst=5 nodelay;
        proxy_pass http://flt_web;
        include /etc/nginx/proxy_params_flt;
    }
}

# ── Administrative application ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.fltexchange.example;

    ssl_certificate     /etc/letsencrypt/live/admin.fltexchange.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.fltexchange.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Restrict the operator panel to known networks. This is the single highest
    # value control on the whole deployment: the panel can suspend accounts and
    # disable trading, and it has no legitimate user on the open internet.
    # Replace with your office range or VPN subnet.
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        limit_req zone=flt_general burst=30 nodelay;
        proxy_pass http://flt_admin;
        include /etc/nginx/proxy_params_flt;
    }
}

# ── HTTP redirect ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.fltexchange.example admin.fltexchange.example;
    return 301 https://$host$request_uri;
}

# ── /etc/nginx/proxy_params_flt ──────────────────────────────────────────────
#
# Save the block below as /etc/nginx/proxy_params_flt.
#
# The X-Forwarded-For line is load-bearing for security, not just for logging:
# the application keys rate limits on the client IP and reads it from this
# header. It MUST be set by this proxy rather than passed through, or a client
# can spoof it and evade every IP-based limit.
#
#   proxy_http_version 1.1;
#   proxy_set_header Upgrade           $http_upgrade;
#   proxy_set_header Connection        "upgrade";
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $remote_addr;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 60s;
#   proxy_connect_timeout 5s;
