# FLT Exchange reverse proxy — the actual production config for
# ftlexchange.com, fronted by Cloudflare with SSL/TLS mode "Full (strict)".
#
# This is the live counterpart to nginx.conf (which stays a generic,
# Let's-Encrypt-based template for a deployment not sitting behind Cloudflare).
# The two differ in exactly one respect: the certificate. Cloudflare's proxy
# already terminates the visitor's TLS connection, so the origin only needs a
# certificate Cloudflare itself trusts — a free 15-year Cloudflare Origin
# Certificate (SSL/TLS → Origin Server → Create Certificate in the dashboard),
# not a publicly-trusted one from certbot.
#
# Requires cloudflare-realip.conf installed as
# /etc/nginx/conf.d/cloudflare-realip.conf — without it, $remote_addr below is
# Cloudflare's edge IP, not the visitor's, and every rate limit collapses onto
# a handful of shared IPs.

upstream flt_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream flt_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=flt_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=flt_auth:10m rate=2r/s;

# ── Consumer application ─────────────────────────────────────────────────────
# The app lives at the bare domain. app.ftlexchange.com is kept only as a
# redirect below, for anyone who bookmarked or was told the earlier address.
server {
    listen 443 ssl http2;
    server_name ftlexchange.com;

    ssl_certificate     /etc/ssl/cloudflare/ftlexchange-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ftlexchange-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 1m;

    location / {
        limit_req zone=flt_general burst=60 nodelay;
        proxy_pass http://flt_web;
        include /etc/nginx/proxy_params_flt;
    }

    # The Android APK, uploaded per release to this directory by an operator.
    # Never in git or the Next build. `add_header` inside a location drops the
    # server-level headers, so HSTS is repeated here.
    location /downloads/ {
        alias /var/www/flt-downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/api/auth/(login|register|password-reset) {
        limit_req zone=flt_auth burst=5 nodelay;
        proxy_pass http://flt_web;
        include /etc/nginx/proxy_params_flt;
    }
}

# app.ftlexchange.com now just forwards to the bare domain, path preserved.
server {
    listen 443 ssl http2;
    server_name app.ftlexchange.com;

    ssl_certificate     /etc/ssl/cloudflare/ftlexchange-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ftlexchange-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ftlexchange.com$request_uri;
}

# ── Administrative application ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.ftlexchange.com;

    ssl_certificate     /etc/ssl/cloudflare/ftlexchange-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ftlexchange-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Not yet restricted to a known network — see deploy/PRODUCTION.md. The
    # admin panel has no legitimate user on the open internet; this is the
    # single highest-value control still outstanding on this deployment.
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        limit_req zone=flt_general burst=30 nodelay;
        proxy_pass http://flt_admin;
        include /etc/nginx/proxy_params_flt;
    }
}

# ── HTTP redirect ────────────────────────────────────────────────────────────
# Cloudflare's edge already forces HTTPS to the visitor in Full (strict) mode,
# but Cloudflare itself may probe or fall back to :80 on the origin, so this
# stays as a safety net rather than the primary redirect.
server {
    listen 80;
    server_name ftlexchange.com app.ftlexchange.com admin.ftlexchange.com;
    return 301 https://$host$request_uri;
}
